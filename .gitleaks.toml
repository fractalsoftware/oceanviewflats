title = "OceanViewFlats Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Ignore documentation and research sample code"
paths = [
    '''^docs/research/.*''',
]

[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "Ignore TypeScript union type aliases and UI/i18n dictionary key properties"
    condition = "AND"
    paths = [
        '''^src/.*\.tsx?$''',
    ]
    regexTarget = "line"
    regexes = [
        '''^\s*(?:export\s+)?type\s+[A-Za-z0-9_]+Key\s*=\s*[A-Za-z0-9_| ]+;\s*$''',
        '''^\s*(?:pitch|title|subtitle|badge|text|author|alt|label|question|answer|desc|description|heading|cta|name|caption|summary|excerpt|eyebrow|review[A-Za-z]*)Key\s*:\s*"[a-z][A-Za-z0-9_]*"(?:\s*\|\s*"[a-z][A-Za-z0-9_]*")*[,;]?\s*$''',
    ]
