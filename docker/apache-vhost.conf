ServerName localhost
Listen 8081

# =============================================================================
# 1. Public Portal (http://localhost:8080)
#    cPanel Pattern A: DocumentRoot at /var/www/ovf/public_html (compiled dist/)
# =============================================================================
<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1 oceanviewflats.localhost
    DocumentRoot /var/www/ovf/public_html

    <Directory /var/www/ovf/public_html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.php
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/public_error.log
    CustomLog ${APACHE_LOG_DIR}/public_access.log combined
</VirtualHost>

# =============================================================================
# 2. Admin Console — Subdomain Mode (http://admin.localhost:8080)
#    cPanel Pattern A (ADR 0005): DocumentRoot mapped strictly to admin/public
# =============================================================================
<VirtualHost *:80>
    ServerName admin.localhost
    DocumentRoot /var/www/ovf/admin/public

    <Directory /var/www/ovf/admin/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/admin_error.log
    CustomLog ${APACHE_LOG_DIR}/admin_access.log combined
</VirtualHost>

# =============================================================================
# 3. Admin Console — Dedicated Local Port Mode (http://localhost:8081)
#    cPanel Pattern A (ADR 0005): Works out-of-the-box without /etc/hosts edits
# =============================================================================
<VirtualHost *:8081>
    ServerName localhost
    DocumentRoot /var/www/ovf/admin/public

    <Directory /var/www/ovf/admin/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/admin_error.log
    CustomLog ${APACHE_LOG_DIR}/admin_access.log combined
</VirtualHost>
