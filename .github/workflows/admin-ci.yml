name: Admin CI

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'src/Domain/**'
      - 'src/Infrastructure/**'
      - '.github/workflows/admin-ci.yml'
      - 'scripts/**'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'src/Domain/**'
      - 'src/Infrastructure/**'
      - '.github/workflows/admin-ci.yml'
      - 'scripts/**'
      - 'composer.json'
      - 'composer.lock'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-quality-and-tests:
    name: Admin Quality & Verification Seam
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, sqlite3, json, argon2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP syntax lint on admin codebase
        run: find admin -name "*.php" -exec php -l {} +

      - name: Run PHPStan static analysis at Level 8 (Strict Typing)
        run: composer admin:phpstan

      - name: Run Admin PHPUnit test suite
        run: composer admin:test

      - name: Run Shared Domain & Infrastructure regression test suite
        run: ./vendor/bin/phpunit --filter "Domain|Infrastructure"
